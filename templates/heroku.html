<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroku Cloud Deployment | МИТП ЛР6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm border">
            <h1 class="display-6 fw-bold text-primary">
                &#9729; Приложение готово к деплою на Heroku
            </h1>
            <p class="fs-5 text-secondary">
                Лабораторная работа №6: Вариант 3 (Задание повышенной сложности №7).
            </p>
            <hr class="my-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="border rounded p-3 bg-light">
                        <small class="text-muted d-block">Платформа:</small>
                        <strong class="text-primary">{{ meta.platform }}</strong>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="border rounded p-3 bg-light">
                        <small class="text-muted d-block">WSGI-сервер:</small>
                        <strong>{{ meta.wsgi_server }}</strong>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="border rounded p-3 bg-light">
                        <small class="text-muted d-block">Python Runtime:</small>
                        <strong>{{ meta.python_version }}</strong>
                    </div>
                </div>
            </div>
            <div class="mt-4">
                <a href="/health" class="btn btn-outline-success">
                    Проверить статус (/health)
                </a>
            </div>
        </div>
    </div>
</body>
</html>
