<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация нового пользователя | МИТП ЛР6</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>Регистрация</h2>
            <p>Создание новой учётной записи</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label for="username">Имя пользователя (логин)</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Придумайте логин (от 3 символов)" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Придумайте пароль (от 6 символов)" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Подтверждение пароля</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       class="form-control" placeholder="Повторите пароль" required>
            </div>

            <button type="submit" class="btn-primary">Зарегистрироваться</button>
        </form>

        <div class="auth-footer">
            <p>Уже зарегистрированы? <a href="{{ url_for('login') }}">Войти в аккаунт</a></p>
        </div>
    </div>
</body>
</html>
