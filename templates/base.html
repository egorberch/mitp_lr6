<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Шаблонизатор Jinja2{% endblock %} - МИТП ЛР6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background-color: #f8fafc; color: #1e293b; }
        .hero-banner { background: linear-gradient(135deg, #0f172a, #1e3a8a); color: white; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="hero-banner py-4 shadow-sm mb-4">
        <div class="container">
            <h1 class="h3 mb-1">{% block header_title %}Дисциплина «Методы и технологии программирования»{% endblock %}</h1>
            <p class="mb-0 text-white-50">{% block header_subtitle %}Лабораторная работа №6: Вариант 3{% endblock %}</p>
        </div>
    </header>

    <main class="container flex-grow-1 mb-4">
        {% block content %}
        <!-- Контент дочернего шаблона -->
        {% endblock %}
    </main>

    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center text-muted small">
            &copy; 2026 Берченёв Егор Константинович | Jinja2 Template Engine Demo
        </div>
    </footer>
</body>
</html>
